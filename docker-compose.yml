services:
  php-fpm:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tile_market_php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "${PHP_FPM_PORT:-9000}:9000"
    depends_on:
      - postgres

  nginx:
    image: nginx:1.27-alpine
    container_name: tile_market_nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm

  postgres:
    image: postgres:16-alpine
    container_name: tile_market_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  manticore:
    image: manticoresearch/manticore:6.3.8
    container_name: tile_market_manticore
    ports:
      - "${MANTICORE_HTTP_PORT:-9308}:9308"
      - "${MANTICORE_SPHINX_PORT:-9306}:9306"
    volumes:
      - ./docker/manticore/manticore.conf:/etc/manticoresearch/manticore.conf:ro
      - manticore_data:/var/lib/manticore
    depends_on:
      - postgres

volumes:
  postgres_data:
  manticore_data:
